<!doctype html>
<html lang="zh-CN" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      try {
        var cachedAppearance = JSON.parse(localStorage.getItem('xlyra:appearance') || 'null')
        var cachedBackground = cachedAppearance && cachedAppearance.background_image
        // 登录/注册/门户/流量图不显示背景图，也未登录，不预加载（受保护接口会 401）
        var onPublicPage = /^\/(login|register|portal|traffic-flow|status)(\/|$)/.test(location.pathname)
        if (!onPublicPage && typeof cachedBackground === 'string' && cachedBackground.charAt(0) === '/') {
          var backgroundPreload = document.createElement('link')
          backgroundPreload.rel = 'preload'
          backgroundPreload.as = 'image'
          backgroundPreload.href = cachedBackground
          backgroundPreload.setAttribute('fetchpriority', 'high')
          document.head.appendChild(backgroundPreload)
        }
      } catch {}
    </script>
    <script>
      ;(function () {
        var varName = '--app-viewport-height'
        function isStandalone() {
          return (
            window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches
          )
        }
        function syncAppViewportHeight() {
          var root = document.documentElement
          if (isStandalone()) {
            root.dataset.standalone = 'true'
            root.style.setProperty(varName, '100vh')
            return
          }
          delete root.dataset.standalone
          root.style.removeProperty(varName)
        }
        syncAppViewportHeight()
        window.addEventListener('resize', syncAppViewportHeight, { passive: true })
        window.addEventListener('orientationchange', syncAppViewportHeight, { passive: true })
        window.addEventListener('pageshow', syncAppViewportHeight, { passive: true })
      })()
    </script>
    <meta name="application-name" content="xLyra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="xLyra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>xLyra</title>
    <style>
      /* 启动遮罩：JS 加载前就要能显示，背景色与 index.css 的 --surface-base / --bg-base 保持一致 */
      #boot-splash {
        position: fixed;
        inset: 0;
        width: 100%;
        height: var(--app-viewport-height, 100dvh);
        min-height: var(--app-viewport-height, 100dvh);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #11131a;
        transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      #boot-splash > canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #boot-splash > img {
        width: 128px;
        height: 128px;
        animation: boot-splash-breathe 2.4s ease-in-out infinite;
      }

      @keyframes boot-splash-breathe {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
          filter: brightness(0.7);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
          filter: brightness(1.15);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash > img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <canvas></canvas>
      <img src="/logo-mark.webp" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
