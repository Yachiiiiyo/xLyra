name: Publish plugin SDK

# Publishes when sdk/js changes land on main and package.json carries a version
# that is not on npm yet. Re-runs and unrelated commits are no-ops. Manual runs
# default to a dry run.
on:
  push:
    branches:
      - main
    paths:
      - "sdk/js/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check SDK types match the CLI templates
        working-directory: server
        run: go test ./cmd/xlyra-plugin -run TestSDKTypesInSync -count=1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; the one bundled with
      # Node can be older.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Show package contents
        working-directory: sdk/js
        run: npm pack --dry-run

      - name: Check whether this version is already on npm
        id: version
        working-directory: sdk/js
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published, skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: ${{ !inputs.dry_run && steps.version.outputs.already != 'true' }}
        working-directory: sdk/js
        run: npm publish
